spring.application.name=lab1

spring.datasource.url=jdbc:mysql://localhost:3306/msa_database
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=user
spring.datasource.password=password

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration/structure, classpath:db/migration/data
spring.flyway.validate-on-migrate=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

spring.jpa.database=mysql
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.orm.jdbc.bind=TRACE

server.port=8080

spring.devtools.restart.enabled=false

springdoc.override-with-generic-response=true